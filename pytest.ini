[tool:pytest]
# Минимальная конфигурация pytest
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Асинхронная поддержка
asyncio_mode = auto

# Маркеры
markers =
    unit: Unit tests (fast, isolated, PostgreSQL with clean database)
    integration: Integration tests (slower, real PostgreSQL + RabbitMQ)

# Опции по умолчанию
addopts = 
    -v
    --tb=short
    --strict-markers